name: Publish image
on:
  workflow_dispatch:
    inputs:
      version:
        description: Container version to publish (for example 0.1.0 or 0.1.1-beta.1)
        required: true
        default: "0.1.0"
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-image
  cancel-in-progress: false
jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/stormavenger/buzz-unraid
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Use a version such as 0.1.0 or 0.1.1-beta.1."
            exit 1
          fi
      - name: Check source and templates
        run: python3 -m unittest discover -s tests -v
      - name: Validate Compose files
        run: docker compose -f compose.yaml -f compose.nvidia.yaml config --quiet
      - name: Build versioned image
        run: docker build --platform linux/amd64 --build-arg IMAGE_VERSION="$VERSION" -t "$IMAGE:$VERSION" .
      - name: Check browser and persistent storage
        run: sh scripts/smoke-test.sh "$IMAGE:$VERSION"
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        run: docker push "$IMAGE:$VERSION"
      - name: Update stable image tag
        shell: bash
        run: |
          if [[ "$VERSION" != *-* ]]; then
            docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
      - name: Collect smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: /tmp/buzz-smoke-*.log
          if-no-files-found: ignore
