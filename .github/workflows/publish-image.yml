name: Publish image
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Container version (for example 0.1.0 or 0.1.1-beta.1)
        required: true
        default: "0.1.2"
        type: string
      publish:
        description: Publish image and attach records to an existing matching GitHub release
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: publish-image
  cancel-in-progress: false
jobs:
  build-test-publish:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/stormavenger/buzz-unraid
      RELEASE_TAG: ${{ github.event.release.tag_name || format('v{0}', inputs.version) }}
      SHOULD_PUBLISH: ${{ github.event_name == 'release' || inputs.publish == true }}
      IS_PRERELEASE: ${{ github.event.release.prerelease || false }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release version
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Use a version such as 0.1.0 or 0.1.1-beta.1."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Check source and public file boundaries
        run: |
          python3 scripts/check-public-files.py
          python3 -m unittest discover -s tests -v
          node --test tests/test_status.mjs
          docker compose -f compose.yaml -f compose.nvidia.yaml config --quiet
          sh scripts/check-build-context.sh
      - name: Build from approved dependencies pinned by digest
        run: >-
          python3 scripts/dependency.py build --image "$IMAGE:$VERSION"
          --version "$VERSION" --revision "$GITHUB_SHA"
      - name: Check browser and persistent storage
        run: sh scripts/smoke-test.sh "$IMAGE:$VERSION"
      - name: Inventory and scan the complete app image
        run: sh scripts/image-records.sh "$IMAGE:$VERSION" release-output
      - name: Link matching dependency sources and package notices
        run: python3 scripts/dependency.py link release-output
      - name: Preserve release preparation records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-records
          retention-days: 7
          path: |
            release-output/*.json
            release-output/*.txt
            release-output/SHA256SUMS
            release-output/notices.tar.gz
          if-no-files-found: ignore
      - name: Verify the matching GitHub release exists
        if: env.SHOULD_PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
      - name: Attach notices, sources and scan records before image publication
        if: env.SHOULD_PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "$RELEASE_TAG"
          release-output/*.json release-output/*.txt release-output/SHA256SUMS
          release-output/notices.tar.gz
          --repo "$GITHUB_REPOSITORY" --clobber
      - name: Authenticate to GHCR
        if: env.SHOULD_PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: env.SHOULD_PUBLISH == 'true'
        run: docker push "$IMAGE:$VERSION"
      - name: Update stable image tag
        if: env.SHOULD_PUBLISH == 'true' && env.IS_PRERELEASE != 'true'
        shell: bash
        run: |
          if [[ "$VERSION" != *-* ]]; then
            docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
      - name: Collect smoke-test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-test-logs
          path: /tmp/buzz-smoke-*.log
          if-no-files-found: ignore
